name: MobileBuild
on:
  workflow_call:
    inputs:
      dependencies_to_update:
        description: '输入 "all" 更新所有haxelib, 或指定库名 (e.g. "lime,openfl")不输入即不给haxelib做任何更新'
        required: false
        type: string
        default: ''
      build_windows:
        description: 'Gerar build Windows (PC)'
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      dependencies_to_update:
        description: '输入 "all" 更新所有haxelib, 也可以输入单个或多个haxelib单独更新他们(e.g. "lime openfl flixel"),不输入即不给haxelib做任何更新'
        required: false
        default: ''

      build_android:
        description: 'Gerar build Android (APK)'
        required: false
        type: boolean
        default: true
      build_ios:
        description: 'Gerar build iOS (IPA)'
        required: false
        type: boolean
        default: true
      build_windows:
        description: 'Gerar build Windows (PC)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      tag: ${{ steps.create_release.outputs.tag }}
      commit_sha: ${{ steps.create_release.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Ensure cache release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view build-cache >/dev/null 2>&1; then
            gh release create build-cache \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false \
              --title "Build cache" \
              --notes "Cache interno dos workflows de build. Não apague."
          fi

      - name: Create Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          TAG="build-${{ github.run_number }}-${COMMIT_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

          {
            echo "Build do NovaFlare Engine"
            echo ""
            echo "**Commit:** \`$COMMIT_SHA\`"
            echo "**Run:** #${{ github.run_number }}"
            echo ""
            echo "Os binários de cada plataforma serão anexados conforme os builds forem concluídos."
          } > RELEASE_NOTES.md

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Build #${{ github.run_number }} ($COMMIT_SHA)" \
            --notes-file RELEASE_NOTES.md

  Android:
    needs: create-release
    runs-on: macos-15
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.build_android) }}
    environment: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'private-build' || 'public-build' }}
    concurrency:
      group: ${{ github.workflow }}-Android-${{ github.ref }}

    env:
      NOVA_GA_GAME_KEY: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NOVA_GA_GAME_KEY || '' }}
      NOVA_GA_SECRET_KEY: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NOVA_GA_SECRET_KEY || '' }}
      NOVA_GA_REQUIRED: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '' }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        id: setup-ndk
        with:
          ndk-version: r28c

      - name: Setup Java JDK
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Check GameAnalytics credentials
        if: github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: ./tools/check-gameanalytics-env.ps1 -Required

      - name: Determine Android cache strategy
        id: android_cache
        run: |
          if [[ "${{ inputs.dependencies_to_update }}" == "all" ]] || \
             [[ "${{ inputs.dependencies_to_update }}" == "android" ]]; then
            echo "skip_cache=true" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.dependencies_to_update }}" && "${{ inputs.dependencies_to_update }}" != "ios" && "${{ inputs.dependencies_to_update }}" != "windows" ]]; then
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
            echo "libs_to_update=${{ inputs.dependencies_to_update }}" >> $GITHUB_OUTPUT
          else
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore Android cache from release
        id: release_cache
        if: steps.android_cache.outputs.skip_cache == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HASH=$(shasum -a 256 hmm.json | cut -c1-12)
          mkdir -p /tmp/rc
          if gh release download build-cache --pattern "haxelib-android-$HASH.tar.zst.part-*" --dir /tmp/rc 2>/dev/null; then
            cat /tmp/rc/haxelib-android-$HASH.tar.zst.part-* | zstd -d | tar -x -C /
            echo "haxelib_hit=true" >> $GITHUB_OUTPUT
            echo "haxelibs restaurados da release build-cache."
          else
            echo "haxelib_hit=false" >> $GITHUB_OUTPUT
            echo "nenhum cache de haxelibs na release para hmm.json $HASH."
          fi
          if gh release download build-cache --pattern "native-android.tar.zst" --dir /tmp/rc 2>/dev/null; then
            zstd -d < /tmp/rc/native-android.tar.zst | tar -x -C /
            echo "cache nativo restaurado da release build-cache."
          fi
          rm -rf /tmp/rc

      - name: Install Android Libraries
        run: |
          haxelib setup ~/haxelib
          if [ "${{ steps.release_cache.outputs.haxelib_hit }}" != "true" ] || [ "${{ steps.android_cache.outputs.skip_cache }}" == "true" ]; then
            haxelib --global git hmm https://github.com/NovaFlare-Engine-haxelib/hmm-3.1.0 70aca779a9d374a6e6b83c18715a3991a147ca37 --skip-dependencies --quiet
            haxelib --global run hmm install
            for library in polymod thx.core thx.semver FlxPartialSound; do
              haxelib --global run hmm reinstall --force "$library"
            done
          else
            echo "haxelibs restaurados do cache, instalação pulada."
          fi

          if [ "${{ steps.android_cache.outputs.update_libs }}" == "true" ]; then
            if [ "${{ steps.android_cache.outputs.skip_cache }}" == "true" ]; then
              echo "强制重新安装所有Android依赖..."
            elif [ -n "${{ steps.android_cache.outputs.libs_to_update }}" ]; then
              echo "更新指定Android依赖: ${{ steps.android_cache.outputs.libs_to_update }}"
              haxelib --global git hmm https://github.com/NovaFlare-Engine-haxelib/hmm-3.1.0 70aca779a9d374a6e6b83c18715a3991a147ca37 --skip-dependencies
              haxelib --global run hmm reinstall --force $(echo "${{ steps.android_cache.outputs.libs_to_update }}")
            fi
          fi

      - name: Save Android haxelibs cache to release
        if: ${{ success() && github.event_name != 'pull_request' && (steps.release_cache.outputs.haxelib_hit != 'true' || steps.android_cache.outputs.update_libs == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HASH=$(shasum -a 256 hmm.json | cut -c1-12)
          mkdir -p /tmp/sc && cd /tmp/sc
          rm -f ./*
          tar -C / -cf - "${GITHUB_WORKSPACE#/}/.haxelib" "${HOME#/}/haxelib" | zstd -T0 -3 | split -b 1900m - "haxelib-android-$HASH.tar.zst.part-"
          for old in $(gh release view build-cache --json assets --jq ".assets[].name | select(startswith(\"haxelib-android-$HASH.tar.zst.part-\"))"); do
            gh release delete-asset build-cache "$old" --yes
          done
          gh release upload build-cache ./haxelib-android-"$HASH".tar.zst.part-* --clobber
          rm -rf /tmp/sc

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Extract current version
        id: get_version
        run: |
          CURRENT_VERSION=$(sed -n 's/.*build-number="\([^"]*\)".*/\1/p' Project.xml)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Clean Gradle build output
        run: rm -rf export/release/android/bin/app/build

      - name: Compile Android
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          CURRENT_VERSION="${{ steps.get_version.outputs.current_version }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NEW_VERSION="${CURRENT_VERSION/-dev/-$COMMIT_SHA}"
            haxelib run lime build android -Dcommit_sha=$COMMIT_SHA -Dbuild_number=$NEW_VERSION
          else
            haxelib run lime build android -Dcommit_sha=$COMMIT_SHA -Dbuild_number=$CURRENT_VERSION
          fi

      - name: Save Android native cache to release
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d export/release/android/obj ]; then
            tar -C / -cf - "${GITHUB_WORKSPACE#/}/export/release/android/obj" | zstd -T0 -3 > /tmp/native-android.tar.zst
            gh release upload build-cache /tmp/native-android.tar.zst --clobber
          fi

      - name: Upload APK to Release
        if: ${{ success() && needs.create-release.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          echo "Enviando APK para a release $TAG"
          gh release upload "$TAG" export/release/android/bin/app/build/outputs/apk/release/*.apk

  iOS:
    needs: create-release
    runs-on: macos-15
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.build_ios) }}
    environment: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'private-build' || 'public-build' }}
    concurrency:
      group: ${{ github.workflow }}-iOS-${{ github.ref }}

    env:
      NOVA_GA_GAME_KEY: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NOVA_GA_GAME_KEY || '' }}
      NOVA_GA_SECRET_KEY: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NOVA_GA_SECRET_KEY || '' }}
      NOVA_GA_REQUIRED: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '' }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Check GameAnalytics credentials
        if: github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: ./tools/check-gameanalytics-env.ps1 -Required

      - name: Determine iOS cache strategy
        id: ios_cache
        run: |
          if [[ "${{ inputs.dependencies_to_update }}" == "all" ]] || \
             [[ "${{ inputs.dependencies_to_update }}" == "ios" ]]; then
            echo "skip_cache=true" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.dependencies_to_update }}" && "${{ inputs.dependencies_to_update }}" != "android" && "${{ inputs.dependencies_to_update }}" != "windows" ]]; then
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
            echo "libs_to_update=${{ inputs.dependencies_to_update }}" >> $GITHUB_OUTPUT
          else
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore iOS cache from release
        id: release_cache
        if: steps.ios_cache.outputs.skip_cache == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HASH=$(shasum -a 256 hmm.json | cut -c1-12)
          mkdir -p /tmp/rc
          if gh release download build-cache --pattern "haxelib-ios-$HASH.tar.zst.part-*" --dir /tmp/rc 2>/dev/null; then
            cat /tmp/rc/haxelib-ios-$HASH.tar.zst.part-* | zstd -d | tar -x -C /
            echo "haxelib_hit=true" >> $GITHUB_OUTPUT
            echo "haxelibs restaurados da release build-cache."
          else
            echo "haxelib_hit=false" >> $GITHUB_OUTPUT
            echo "nenhum cache de haxelibs na release para hmm.json $HASH."
          fi
          if gh release download build-cache --pattern "native-ios.tar.zst" --dir /tmp/rc 2>/dev/null; then
            zstd -d < /tmp/rc/native-ios.tar.zst | tar -x -C /
            echo "cache nativo restaurado da release build-cache."
          fi
          rm -rf /tmp/rc

      - name: Install iOS Libraries
        run: |
          haxelib setup ~/haxelib
          if [ "${{ steps.release_cache.outputs.haxelib_hit }}" != "true" ] || [ "${{ steps.ios_cache.outputs.skip_cache }}" == "true" ]; then
            haxelib --global git hmm https://github.com/NovaFlare-Engine-haxelib/hmm-3.1.0 70aca779a9d374a6e6b83c18715a3991a147ca37 --skip-dependencies --quiet
            haxelib --global run hmm install
            for library in polymod thx.core thx.semver FlxPartialSound; do
              haxelib --global run hmm reinstall --force "$library"
            done
          else
            echo "haxelibs restaurados do cache, instalação pulada."
          fi

          if [ "${{ steps.ios_cache.outputs.update_libs }}" == "true" ]; then
            if [ "${{ steps.ios_cache.outputs.skip_cache }}" == "true" ]; then
              echo "强制重新安装所有iOS依赖..."
            elif [ -n "${{ steps.ios_cache.outputs.libs_to_update }}" ]; then
              echo "更新指定iOS依赖: ${{ steps.ios_cache.outputs.libs_to_update }}"
              haxelib --global git hmm https://github.com/NovaFlare-Engine-haxelib/hmm-3.1.0 70aca779a9d374a6e6b83c18715a3991a147ca37 --skip-dependencies
              haxelib --global run hmm reinstall --force $(echo "${{ steps.ios_cache.outputs.libs_to_update }}")
            fi
          fi

          echo "lime revision: $(git -C .haxelib/lime/git rev-parse HEAD)"
          echo "openfl revision: $(git -C .haxelib/openfl/git rev-parse HEAD)"

      - name: Save iOS haxelibs cache to release
        if: ${{ success() && github.event_name != 'pull_request' && (steps.release_cache.outputs.haxelib_hit != 'true' || steps.ios_cache.outputs.update_libs == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HASH=$(shasum -a 256 hmm.json | cut -c1-12)
          mkdir -p /tmp/sc && cd /tmp/sc
          rm -f ./*
          tar -C / -cf - "${GITHUB_WORKSPACE#/}/.haxelib" "${HOME#/}/haxelib" | zstd -T0 -3 | split -b 1900m - "haxelib-ios-$HASH.tar.zst.part-"
          for old in $(gh release view build-cache --json assets --jq ".assets[].name | select(startswith(\"haxelib-ios-$HASH.tar.zst.part-\"))"); do
            gh release delete-asset build-cache "$old" --yes
          done
          gh release upload build-cache ./haxelib-ios-"$HASH".tar.zst.part-* --clobber
          rm -rf /tmp/sc

      - name: Compile iOS
        run: haxelib run lime build ios -arm64 -nosign -Dcommit_sha=$(git rev-parse --short HEAD)

      - name: Save iOS native cache to release
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d export/release/ios/obj ]; then
            tar -C / -cf - "${GITHUB_WORKSPACE#/}/export/release/ios/obj" | zstd -T0 -3 > /tmp/native-ios.tar.zst
            gh release upload build-cache /tmp/native-ios.tar.zst --clobber
          fi

      - name: Make IPA And iOS Zip
        run: |
          cd export/release/ios/build/Release-iphoneos
          rm -rf Payload
          mkdir Payload
          mv *.app Payload
          zip -r NovaFlareEngine.ipa Payload

      - name: Create iOS zip package
        run: |
          cd export/release/ios/build/Release-iphoneos/
          zip -r ios.zip *.ipa

      - name: Upload IPA to Release
        if: ${{ success() && needs.create-release.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          echo "Enviando IPA para a release $TAG"
          gh release upload "$TAG" export/release/ios/build/Release-iphoneos/ios.zip

  Windows:
    needs: create-release
    runs-on: windows-latest
    if: ${{ !cancelled() && inputs.build_windows }}
    environment: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'private-build' || 'public-build' }}
    concurrency:
      group: ${{ github.workflow }}-Windows-${{ github.ref }}

    env:
      NOVA_GA_GAME_KEY: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NOVA_GA_GAME_KEY || '' }}
      NOVA_GA_SECRET_KEY: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NOVA_GA_SECRET_KEY || '' }}
      NOVA_GA_REQUIRED: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '' }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Check GameAnalytics credentials
        if: github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: ./tools/check-gameanalytics-env.ps1 -Required

      - name: Determine Windows cache strategy
        id: windows_cache
        shell: pwsh
        run: |
          $depInput = "${{ inputs.dependencies_to_update }}"
          if ($depInput -eq "all" -or $depInput -eq "windows") {
            echo "skip_cache=true" >> $env:GITHUB_OUTPUT
            echo "update_libs=true" >> $env:GITHUB_OUTPUT
          } elseif ($depInput -ne "" -and $depInput -ne "android" -and $depInput -ne "ios") {
            echo "skip_cache=false" >> $env:GITHUB_OUTPUT
            echo "update_libs=true" >> $env:GITHUB_OUTPUT
            echo "libs_to_update=$depInput" >> $env:GITHUB_OUTPUT
          } else {
            echo "skip_cache=false" >> $env:GITHUB_OUTPUT
            echo "update_libs=false" >> $env:GITHUB_OUTPUT
          }

      - name: Restore Windows haxelibs cache
        id: windows_libs
        if: steps.windows_cache.outputs.skip_cache == 'false'
        uses: actions/cache@v4
        with:
          path: |
            .haxelib
            C:\haxelib
          key: haxelib-windows-${{ hashFiles('hmm.json') }}-${{ github.run_id }}
          restore-keys: |
            haxelib-windows-${{ hashFiles('hmm.json') }}-

      - name: Restore Windows native build cache
        id: windows_native
        if: steps.windows_cache.outputs.skip_cache == 'false'
        uses: actions/cache@v4
        with:
          path: |
            export/release/windows/obj
          key: native-windows-${{ hashFiles('Project.xml', 'hmm.json', 'source/**') }}-${{ github.run_id }}
          restore-keys: |
            native-windows-

      - name: Enable Windows long path support
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Type DWord -Force
          $check = Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled"
          Write-Output "LongPathsEnabled = $($check.LongPathsEnabled)"

      - name: Install Libraries
        shell: pwsh
        run: |
          haxelib setup C:\haxelib
          if ([string]::IsNullOrEmpty("${{ steps.windows_libs.outputs.cache-matched-key }}") -or "${{ steps.windows_cache.outputs.skip_cache }}" -eq "true") {
            haxelib git hmm https://github.com/NovaFlare-Engine-haxelib/hmm-3.1.0 70aca779a9d374a6e6b83c18715a3991a147ca37 --skip-dependencies --quiet
            haxelib run hmm install
            foreach ($library in @("polymod", "thx.core", "thx.semver", "FlxPartialSound")) {
              haxelib run hmm reinstall --force $library
            }
          } else {
            Write-Output "haxelibs restaurados do cache, instalação pulada."
          }

          if ("${{ steps.windows_cache.outputs.update_libs }}" -eq "true") {
            if ("${{ steps.windows_cache.outputs.skip_cache }}" -eq "true") {
              Write-Output "强制重新安装所有Windows依赖..."
            } elseif (-not [string]::IsNullOrEmpty("${{ steps.windows_cache.outputs.libs_to_update }}")) {
              $libs = "${{ steps.windows_cache.outputs.libs_to_update }}"
              Write-Output "更新指定Windows依赖: $libs"
              haxelib git hmm https://github.com/NovaFlare-Engine-haxelib/hmm-3.1.0 70aca779a9d374a6e6b83c18715a3991a147ca37 --skip-dependencies
              haxelib run hmm reinstall --force $libs.Split(' ')
            }
          }

          Write-Output "lime revision: $(git -C .haxelib/lime/git rev-parse HEAD)"
          Write-Output "openfl revision: $(git -C .haxelib/openfl/git rev-parse HEAD)"

      - name: Extract current version
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content Project.xml -Raw
          if ($content -match 'build-number="([^"]*)"') {
              $CURRENT_VERSION = $matches[1]
              echo "current_version=$CURRENT_VERSION" >> $env:GITHUB_OUTPUT
              Write-Output "成功提取版本号: $CURRENT_VERSION"
          } else {
              Write-Error "在Project.xml中未找到build-number属性"
              exit 1
          }

      - name: Compile
        shell: pwsh
        run: |
          $COMMIT_SHA = (git rev-parse --short HEAD)
          $CURRENT_VERSION = "${{ steps.get_version.outputs.current_version }}"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $NEW_VERSION = $CURRENT_VERSION -replace "-dev", "-$COMMIT_SHA"
            haxelib run lime build windows -Dcommit_sha=$COMMIT_SHA -Dbuild_number=$NEW_VERSION
          } else {
            haxelib run lime build windows -Dcommit_sha=$COMMIT_SHA -Dbuild_number=$CURRENT_VERSION
          }

      - name: Create Windows zip package
        shell: pwsh
        run: |
          cd export\release\windows\bin
          Compress-Archive -Path * -DestinationPath windows.zip

      - name: Upload Windows zip to Release
        if: ${{ success() && needs.create-release.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        shell: pwsh
        run: |
          Write-Output "Enviando windows.zip para a release $env:TAG"
          gh release upload $env:TAG export\release\windows\bin\windows.zip
