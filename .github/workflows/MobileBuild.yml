name: MobileBuild
on:
  workflow_call:
    inputs:
      dependencies_to_update:
        description: '输入 "all" 更新所有haxelib, 或指定库名 (e.g. "lime,openfl")不输入即不给haxelib做任何更新'
        required: false
        type: string
        default: ''

  workflow_dispatch:
    inputs:
      dependencies_to_update:
        description: '输入 "all" 更新所有haxelib, 也可以输入单个或多个haxelib单独更新他们(e.g. "lime openfl flixel"),不输入即不给haxelib做任何更新'
        required: false
        default: ''

      build_android:
        description: 'Gerar build Android (APK)'
        required: false
        type: boolean
        default: true
      build_ios:
        description: 'Gerar build iOS (IPA)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  Android:
    runs-on: macos-15
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    environment: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'private-build' || 'public-build' }}
    concurrency:
      group: ${{ github.workflow }}-Android-${{ github.ref }}

    env:
      NOVA_GA_GAME_KEY: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NOVA_GA_GAME_KEY || '' }}
      NOVA_GA_SECRET_KEY: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NOVA_GA_SECRET_KEY || '' }}
      NOVA_GA_REQUIRED: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        id: setup-ndk
        with:
          ndk-version: r28c

      - name: Setup Java JDK
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Check GameAnalytics credentials
        if: github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: ./tools/check-gameanalytics-env.ps1 -Required

      - name: Determine Android cache strategy
        id: android_cache
        run: |
          if [[ "${{ inputs.dependencies_to_update }}" == "all" ]] || \
             [[ "${{ inputs.dependencies_to_update }}" == "android" ]]; then
            echo "skip_cache=true" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.dependencies_to_update }}" && "${{ inputs.dependencies_to_update }}" != "ios" ]]; then
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
            echo "libs_to_update=${{ inputs.dependencies_to_update }}" >> $GITHUB_OUTPUT
          else
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore Android libs from R2
        if: steps.android_cache.outputs.skip_cache == 'false'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if ! aws s3api head-object --bucket "$R2_BUCKET" --key android-libs.tar.gz --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
            echo "Nenhum cache no R2, seguindo sem ele."
            exit 0
          fi

          if aws s3 cp "s3://$R2_BUCKET/android-libs.tar.gz" /tmp/android-libs.tar.gz --endpoint-url "$R2_ENDPOINT" \
             && tar -xzf /tmp/android-libs.tar.gz; then
            echo "Cache restaurado do R2."
          else
            echo "Falha ao restaurar o cache, seguindo sem ele."
            rm -rf .haxelib
          fi

      - name: Install Android Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib --global git hmm https://github.com/NovaFlare-Engine-haxelib/hmm-3.1.0 70aca779a9d374a6e6b83c18715a3991a147ca37 --skip-dependencies --quiet
          haxelib --global run hmm install
          for library in polymod thx.core thx.semver FlxPartialSound; do
            haxelib --global run hmm reinstall --force "$library"
          done

          if [ "${{ steps.android_cache.outputs.update_libs }}" == "true" ]; then
            if [ "${{ steps.android_cache.outputs.skip_cache }}" == "true" ]; then
              echo "强制重新安装所有Android依赖..."
            elif [ -n "${{ steps.android_cache.outputs.libs_to_update }}" ]; then
              echo "更新指定Android依赖: ${{ steps.android_cache.outputs.libs_to_update }}"
              haxelib --global git hmm https://github.com/NovaFlare-Engine-haxelib/hmm-3.1.0 70aca779a9d374a6e6b83c18715a3991a147ca37 --skip-dependencies
              haxelib --global run hmm reinstall --force $(echo "${{ steps.android_cache.outputs.libs_to_update }}")
            fi
          fi

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Extract current version
        id: get_version
        run: |
          CURRENT_VERSION=$(sed -n 's/.*build-number="\([^"]*\)".*/\1/p' Project.xml)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Compile Android
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          CURRENT_VERSION="${{ steps.get_version.outputs.current_version }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NEW_VERSION="${CURRENT_VERSION/-dev/-$COMMIT_SHA}"
            haxelib run lime build android -Dcommit_sha=$COMMIT_SHA -Dbuild_number=$NEW_VERSION
          else
            haxelib run lime build android -Dcommit_sha=$COMMIT_SHA -Dbuild_number=$CURRENT_VERSION
          fi

      - name: Create Android Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-${{ github.run_number }}-$(git rev-parse --short HEAD)"
          gh release create "$TAG" \
            export/release/android/bin/app/build/outputs/apk/release/*.apk \
            --target "$GITHUB_SHA" \
            --title "Android $TAG" \
            --notes "Build Android do NovaFlare Engine"

      - name: Save Android libs to R2
        if: steps.android_cache.outputs.skip_cache == 'false'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if [ ! -d .haxelib ]; then
            echo "Sem .haxelib para salvar, pulando."
            exit 0
          fi

          tar -czf /tmp/android-libs.tar.gz .haxelib
          aws s3 cp /tmp/android-libs.tar.gz "s3://$R2_BUCKET/android-libs.tar.gz" --endpoint-url "$R2_ENDPOINT" \
            || echo "Falha ao salvar o cache, o build não é afetado."

  iOS:
    runs-on: macos-15
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ios }}
    environment: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'private-build' || 'public-build' }}
    concurrency:
      group: ${{ github.workflow }}-iOS-${{ github.ref }}

    env:
      NOVA_GA_GAME_KEY: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NOVA_GA_GAME_KEY || '' }}
      NOVA_GA_SECRET_KEY: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NOVA_GA_SECRET_KEY || '' }}
      NOVA_GA_REQUIRED: ${{ github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Check GameAnalytics credentials
        if: github.repository == 'NovaFlare-Engine-Concentration/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: ./tools/check-gameanalytics-env.ps1 -Required

      - name: Determine iOS cache strategy
        id: ios_cache
        run: |
          if [[ "${{ inputs.dependencies_to_update }}" == "all" ]] || \
             [[ "${{ inputs.dependencies_to_update }}" == "ios" ]]; then
            echo "skip_cache=true" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.dependencies_to_update }}" && "${{ inputs.dependencies_to_update }}" != "android" ]]; then
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
            echo "libs_to_update=${{ inputs.dependencies_to_update }}" >> $GITHUB_OUTPUT
          else
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore iOS libs from R2
        if: steps.ios_cache.outputs.skip_cache == 'false'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if ! aws s3api head-object --bucket "$R2_BUCKET" --key ios-libs.tar.gz --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
            echo "Nenhum cache no R2, seguindo sem ele."
            exit 0
          fi

          if aws s3 cp "s3://$R2_BUCKET/ios-libs.tar.gz" /tmp/ios-libs.tar.gz --endpoint-url "$R2_ENDPOINT" \
             && tar -xzf /tmp/ios-libs.tar.gz; then
            echo "Cache restaurado do R2."
          else
            echo "Falha ao restaurar o cache, seguindo sem ele."
            rm -rf .haxelib
          fi

      - name: Install iOS Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib --global git hmm https://github.com/NovaFlare-Engine-haxelib/hmm-3.1.0 70aca779a9d374a6e6b83c18715a3991a147ca37 --skip-dependencies --quiet
          haxelib --global run hmm install
          for library in polymod thx.core thx.semver FlxPartialSound; do
            haxelib --global run hmm reinstall --force "$library"
          done

          if [ "${{ steps.ios_cache.outputs.update_libs }}" == "true" ]; then
            if [ "${{ steps.ios_cache.outputs.skip_cache }}" == "true" ]; then
              echo "强制重新安装所有iOS依赖..."
            elif [ -n "${{ steps.ios_cache.outputs.libs_to_update }}" ]; then
              echo "更新指定iOS依赖: ${{ steps.ios_cache.outputs.libs_to_update }}"
              haxelib --global git hmm https://github.com/NovaFlare-Engine-haxelib/hmm-3.1.0 70aca779a9d374a6e6b83c18715a3991a147ca37 --skip-dependencies
              haxelib --global run hmm reinstall --force $(echo "${{ steps.ios_cache.outputs.libs_to_update }}")
            fi
          fi

          echo "lime revision: $(git -C .haxelib/lime/git rev-parse HEAD)"
          echo "openfl revision: $(git -C .haxelib/openfl/git rev-parse HEAD)"

      - name: Compile iOS
        run: haxelib run lime build ios -arm64 -nosign -Dcommit_sha=$(git rev-parse --short HEAD)

      - name: Make IPA And iOS Zip
        run: |
          cd export/release/ios/build/Release-iphoneos
          rm -rf Payload
          mkdir Payload
          mv *.app Payload
          zip -r NovaFlareEngine.ipa Payload

      - name: Create iOS zip package
        run: |
          cd export/release/ios/build/Release-iphoneos/
          zip -r ios.zip *.ipa

      - name: Create iOS Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-${{ github.run_number }}-$(git rev-parse --short HEAD)"
          gh release create "$TAG" \
            export/release/ios/build/Release-iphoneos/ios.zip \
            --target "$GITHUB_SHA" \
            --title "iOS $TAG" \
            --notes "Build iOS do NovaFlare Engine"

      - name: Save iOS libs to R2
        if: steps.ios_cache.outputs.skip_cache == 'false'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if [ ! -d .haxelib ]; then
            echo "Sem .haxelib para salvar, pulando."
            exit 0
          fi

          tar -czf /tmp/ios-libs.tar.gz .haxelib
          aws s3 cp /tmp/ios-libs.tar.gz "s3://$R2_BUCKET/ios-libs.tar.gz" --endpoint-url "$R2_ENDPOINT" \
            || echo "Falha ao salvar o cache, o build não é afetado."
